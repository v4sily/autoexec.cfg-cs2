//=======================================================================
// 1. CONFIGURACIÓN BÁSICA
//=======================================================================

cl_use_opens_buy_menu "0"          // 'E' no abre menú de compra accidentalmente
cl_dm_buyrandomweapons "0"         // No comprar armas aleatorias en deathmatch

//=======================================================================
// 2. RED Y RENDIMIENTO.
//=======================================================================
// --- CONFIGURACIÓN COMPLETA OPTIMIZADA ---
cl_net_buffer_ticks 0
cl_tickpacket_desired_queuelength 0
cl_interp_ratio 1
cl_interp 0.015625
rate "786432"                                      // Máximo rate (ideal para conexiones >500Mbps)
net_client_steamdatagram_enable_override "1"       // Optimiza ruta de red (mejor ping/protección)
ui_steam_overlay_notification_position "bottomright" // Notificaciones Steam discretas
engine_no_focus_sleep 0 //hace que cuando mimizas no baje el rendimiento del juego
cl_hud_telemetry_serverrecvmargin_graph_show 0 // Para limpiar la pantalla de gráficos innecesarios.


//=======================================================================
// 3. VISUALES Y SONIDO TÁCTICO
//=======================================================================
cl_crosshair_sniper_width "3"                // Mira AWP más gruesa.
r_show_build_info "0"                        // Oculta la información de versión en pantalla.
snd_voipvolume "2.0"                         // Sube el volumen de voz.
snd_spatialize_lerp "0.001"                  // Audio direccional más reactivo.
snd_steamaudio_enable_reverb "0"             // Menos reverberación ambiental.
snd_musicvolume "0"                          // Elimina música ambiental (silencio total)
snd_menumusic_volume "0"                     // Elimina música del menú completamente
snd_headphone_pan_exponent 1.0
snd_front_headphone_position 90.0
snd_rear_headphone_position 90.0
snd_mixahead 0.011
speaker_config 1

//=======================================================================
// 4. VIDEO (Configuraciones de video y optimización de FPS)
//=======================================================================
r_drawtracers_firstperson "0"         // Desactiva los trazadores en primera persona para facilitar la mira
fps_max_ui "64" // Limita los FPS en el menú principal para reducir carga de GPU




// ====================================================================
//  TU SET DE BINDS COMPLETOS
// ====================================================================

// Movimiento estándar
bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"

// Salto
bind "mwheeldown" "+jump"
bind "mwheelup" "+jump"
bind "space" "+jump"

// Cambio de mano
unbind "mouse4"
bind "mouse4" "switchhands"

// Salida rápida
unbind "f8"
unbind "f9"
bind "f8" "disconnect"                       // Vuelve al menú.
bind "f9" "quit"                             // Cierra el juego.

// Radar dinámico
alias "+radar_zoom" "cl_radar_scale 0.35; cl_radar_always_centered 0"
alias "-radar_zoom" "cl_radar_scale 0.70; cl_radar_always_centered 1"
bind "capslock" "+radar_zoom"

// Muteos y frases directas
unbind "f1"
unbind "f2"
unbind "f3"
unbind "f4"
unbind "f5"
bind "f1" "say Better luck next round, maybe"
bind "f2" "say You missed the shot, I missed the respect"
bind "f3" "say I’m the reason you’re typing in all chat"
bind "f4" "say EZ"

// ====================================================================
// 5.1. CHAT BINDS (NUMPAD)
// ====================================================================
// Limpieza previa
unbind "kp_0"; unbind "kp_1"; unbind "kp_2"; unbind "kp_3"
unbind "kp_4"; unbind "kp_5"; unbind "kp_6"
unbind "kp_7"; unbind "kp_8"; unbind "kp_9"

// Equipo
bind "kp_1" "say_team [ECO] No compren / Eco ronda"
bind "kp_2" "say_team [FORZADA] Forzamos compra / Forçar"
bind "kp_3" "say_team [DROP] ¿Me dropean? / Preciso de drop"
bind "kp_4" "say_team [INFO] Yo holdeo acá / Cuidando zona"
bind "kp_5" "say_team [ROTACION] Rotemos / Rotacionar!"
bind "kp_6" "say_team Buena ronda chicos / Boa rodada!"

// Global
bind "kp_7" "say Buena partida / Bom jogo para todos!"
bind "kp_8" "say Buena mitad / Boa metade!"
bind "kp_9" "say Bien jugado / Bem jogado!"
bind "kp_0" "say ¡Muchas gracias por la partida! / Muito obrigado pelo jogo!"

// Mostrar detalles avanzados de daño
alias displaydamage "displaydamage_on"
alias displaydamage_on "con_filter_text Damage Given To; con_filter_text_out Player:; con_filter_enable 2; developer 1; playvol buttons\\blip1 0.5; alias displaydamage 'displaydamage_off'"
alias displaydamage_off "con_filter_enable 0; developer 0; playvol buttons\\blip2 0.5; alias displaydamage 'displaydamage_on'"
bind "F6" "displaydamage" // Asocia la tecla que prefieras (por defecto F6)


// ====================================================================
// 6. CARGA DE CONFIGURACIÓN
// ====================================================================
host_writeconfig
echo ">>> AUTOEXEC CS2 ULTRA OPTIMIZADO CARGADO <<<"
