// ====================================================================
// 1. CONEXIÓN, INTERNET Y RED
// ====================================================================
rate "786432"                                // Ancho de banda máximo.
cl_interp "0.015625"                         // Interpolación mínima.
cl_interp_ratio "1"                          // Menor retraso de interpolación.
cl_predict_body_shot_fx "0"                  // Sin efecto predictivo de impactos al cuerpo.
cl_predict_head_shot_fx "0"                  // Sin efecto predictivo de impactos a la cabeza.
cl_predict_kill_ragdolls "0"                 // Sin ragdolls predictivos al matar.
sv_clockcorrection_msecs "0"                 // Corrección de reloj al mínimo.

// ====================================================================
// 2. RENDIMIENTO, FPS Y LATENCIA DE ENTRADA
// ====================================================================
fps_max "0"                                  // FPS sin límite.
engine_low_latency_sleep_after_client_tick "true" // Menor latencia percibida con Reflex.

// ====================================================================
// 3. OPTIMIZACIÓN VISUAL Y CLARIDAD COMPETITIVA
// ====================================================================
cl_crosshair_sniper_width "3"                // Mira AWP más gruesa.
r_drawtracers_firstperson "0"                // Sin trazadoras propias.
cl_hide_avatar_images "0"                    // Avatares visibles.
r_show_build_info "0"                        // Oculta la información de versión en pantalla.

// ====================================================================
// 4. AUDIO TÁCTICO Y COMUNICACIÓN
// ====================================================================
snd_voipvolume "2.0"                         // Sube el volumen de voz.
snd_headphone_eq "1"                         // EQ para claridad.
snd_spatialize_lerp "0.001"                  // Audio direccional más reactivo.
snd_steamaudio_enable_reverb "0"             // Menos reverberación ambiental.

// ====================================================================
// 5. TU SET DE BINDS COMPLETOS
// ====================================================================
// Movimiento estándar
bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"

// Salto
bind "mwheeldown" "+jump"
bind "mwheelup" "+jump"
bind "space" "+jump"

// Cambio de mano
unbind "mouse4"
bind "mouse4" "switchhands"

// Salida rápida
unbind "f8"
unbind "f9"
bind "f8" "disconnect"                       // Vuelve al menú.
bind "f9" "quit"                             // Cierra el juego.

// Muteos y frases directas
unbind "f1"
unbind "f2"
unbind "f3"
unbind "f4"
bind "f1" "say EZ"
bind "f2" "say GG"
bind "f3" "toggle cl_mute_enemy_team"        // Mute rival.
bind "f4" "voice_mute_toggle"                // Mute voz general.

// Radar dinámico
alias "+radar_zoom" "cl_radar_scale 0.35; cl_radar_always_centered 0"
alias "-radar_zoom" "cl_radar_scale 0.70; cl_radar_always_centered 1"
bind "capslock" "+radar_zoom"

// ====================================================================
// 5.1. CHAT BINDS (NUMPAD)
// ====================================================================
// Limpieza previa
unbind "kp_0"; unbind "kp_1"; unbind "kp_2"; unbind "kp_3"
unbind "kp_4"; unbind "kp_5"; unbind "kp_6"
unbind "kp_7"; unbind "kp_8"; unbind "kp_9"

// Equipo
bind "kp_1" "say_team [ECO] No compren / Eco ronda"
bind "kp_2" "say_team [FORZADA] Forzamos compra / Forçar"
bind "kp_3" "say_team [DROP] ¿Me dropean? / Preciso de drop"
bind "kp_4" "say_team [INFO] Yo holdeo acá / Cuidando zona"
bind "kp_5" "say_team [ROTACION] Rotemos / Rotacionar!"
bind "kp_6" "say_team Buena ronda chicos / Boa rodada!"

// Global
bind "kp_7" "say Buena partida / Bom jogo para todos!"
bind "kp_8" "say Buena mitad / Boa metade!"
bind "kp_9" "say Bien jugado / Bem jogado!"
bind "kp_0" "say ¡Muchas gracias por la partida! / Muito obrigado pelo jogo!"

// ====================================================================
// 6. CARGA DE CONFIGURACIÓN
// ====================================================================
host_writeconfig
echo ">>> AUTOEXEC CS2 ULTRA OPTIMIZADO CARGADO <<<"